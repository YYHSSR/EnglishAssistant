name: Ubuntu compatibility
on:
  push:
    paths: ['src/**', 'linux/**', 'tests/**', 'data/**', 'CMakeLists.txt', '*.sh', '.github/workflows/linux.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['18.04', '20.04', '24.04']
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on actual Ubuntu userspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/app" -w /app -e DEBIAN_FRONTEND=noninteractive ubuntu:${{ matrix.ubuntu }} sh -eu -c '
            apt-get update -qq
            apt-get install -y -qq g++ cmake python3-gi gir1.2-ibus-1.0 gir1.2-gtk-3.0 ibus ibus-libpinyin dbus-x11 xvfb xauth locales
            locale-gen en_US.UTF-8
            export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
            mkdir -p build
            cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            cmake --build . -- -j2
            ctest --output-on-failure
            cd ..
            python3 -m py_compile linux/*.py tests/linux_integration.py
            dbus-run-session -- xvfb-run -a sh -eu -c "ibus-daemon --daemonize --panel=disable; sleep 2; python3 tests/linux_integration.py"
          '
